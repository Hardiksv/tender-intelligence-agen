services:
  # 1. PostgreSQL Database with pgvector
  - type: postgres
    name: tender-db
    plan: free
    ipAllowList: []
    databaseName: tender_db
    user: postgres

  # 2. FastAPI Backend API & Ingestion Service
  - type: web
    name: tender-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tender-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: LLM_FALLBACK_MODEL
        value: gemini/gemini-2.5-pro
      - key: EMBEDDING_MODEL
        value: gemini/text-embedding-004
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: INGESTION_ENABLED
        value: "true"
      - key: DISCOVERY_ENABLED
        value: "false"

  # 3. React Single-Page Application (Frontend)
  - type: web
    name: tender-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tender-backend
          property: host
